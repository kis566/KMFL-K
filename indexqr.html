<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Generator Pro | CodeShalaByKMFL</title>
   <!-- 🛡️ PROTECTION SCRIPT - HEAD MEIN SABSE UPAR -->
    <script>
    (function() {
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || e.keyCode === 123 ||
                (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) ||
                (e.ctrlKey && ['U','S'].includes(e.key))) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        }, true);

        setInterval(function() {
            var w = window.outerWidth - window.innerWidth;
            var h = window.outerHeight - window.innerHeight;
            if (w > 160 || h > 160) {
                document.body.innerHTML = '<div style="text-align:center;padding:50px;font-family:sans-serif;background:#000;color:#f00;height:100vh;"><h1>⛔ Access Denied</h1><p>Inspecting is not allowed on this page.</p></div>';
            }
        }, 500);

        setInterval(() => { debugger; }, 100);
        setInterval(() => console.clear(), 1000);

        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());
    })();
    </script>
  
  <!-- Link CSS -->
  <link rel="stylesheet" href="styleqr.css" />
  
  <!-- ✅ QR Code Styling Library (Online CDN Version) -->
  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0/lib/qr-code-styling.js"></script>
  
  <!-- ✅ Link JavaScript File -->
  <script defer src="script.js"></script>
</head>
<body>
  <nav>
    <h1>⚡ CodeShalaByKMFL - QR Generator Pro</h1>
    <button id="themeToggle">🌓</button>
  </nav>

  <main>
    <div class="form-box">
      <input type="text" id="qrText" placeholder="Enter your link or text..." />
      
      <div class="customize">
        <label>QR Color: <input type="color" id="qrColor" value="#00ffea"></label>
        <label>Background: <input type="color" id="bgColor" value="#000000"></label>
        <label>Eye Style: 
          <select id="eyeStyle">
            <option value="square">Square</option>
            <option value="circle">Circle</option>
          </select>
        </label>
        <label>Pattern Style: 
          <select id="dotStyle">
            <option value="square">Square</option>
            <option value="dots">Dots</option>
            <option value="rounded">Rounded</option>
          </select>
        </label>
        <label>Logo: <input type="file" id="logoUpload" accept="image/*"></label>
      </div>

      <button id="generateBtn">Generate QR</button>
    </div>

    <div class="qr-section">
      <div id="qrContainer"></div>
      <div class="qr-actions">
        <button id="downloadPng">Download PNG</button>
        <button id="downloadJpg">Download JPG</button>
        <button id="downloadSvg">Download SVG</button>
        <button id="copyLink">Copy Link</button>
      </div>
    </div>
  </main>

  <footer>
    <p>Made with ❤️ by <strong>CodeShalaByKMFL 🫠</strong></p>
  </footer>

  <script src="scriptqr.js"></script>
</body>
</html>
